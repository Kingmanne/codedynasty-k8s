# login: Checks credentials against PostgreSQL (replaces login Lambda)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: login
automountServiceAccountToken: false # the app never calls the Kubernetes API
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: login
  labels:
    app: login
spec:
  replicas: 1 # one copy each to fit the 4 GB node; raise to 2 for zero-downtime updates
  selector:
    matchLabels:
      app: login
  template:
    metadata:
      labels:
        app: login
    spec:
      serviceAccountName: login
      containers:
        - name: login
          image: login # placeholder: kustomization.yaml swaps in the ECR image and tag
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: app-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: JWT_SECRET
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              memory: 192Mi
          readinessProbe:
            httpGet:
              path: /ready
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000 # the "node" user in the official Node.js image
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: login
  labels:
    app: login
spec:
  type: ClusterIP
  selector:
    app: login
  ports:
    - name: http
      port: 80
      targetPort: 3000

# Plain (non-secret) settings shared by the services.
# The database password is NOT here: it lives in the postgres-credentials Secret,
# created with kubectl (Phase 2) and from AWS SSM via External Secrets (Phase 3).
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
data:
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_NAME: codedynasty
  DB_USER: postgres
  AWS_REGION: eu-west-2
  SQS_QUEUE_URL: https://sqs.eu-west-2.amazonaws.com/371510064293/codedynasty-signup-queue
  ALLOWED_ORIGIN: http://localhost:5173

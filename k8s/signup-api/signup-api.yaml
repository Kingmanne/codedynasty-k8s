# signup-api: Validates signups and queues them on SQS (replaces signup-producer Lambda)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: signup-api
automountServiceAccountToken: false # the app never calls the Kubernetes API
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: signup-api
  labels:
    app: signup-api
spec:
  replicas: 1 # one copy each to fit the 4 GB node; raise to 2 for zero-downtime updates
  selector:
    matchLabels:
      app: signup-api
  template:
    metadata:
      labels:
        app: signup-api
    spec:
      serviceAccountName: signup-api
      containers:
        - name: signup-api
          image: signup-api # placeholder: kustomization.yaml swaps in the ECR image and tag
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: app-config
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              memory: 192Mi
          readinessProbe:
            httpGet:
              path: /ready
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000 # the "node" user in the official Node.js image
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: signup-api
  labels:
    app: signup-api
spec:
  type: ClusterIP
  selector:
    app: signup-api
  ports:
    - name: http
      port: 80
      targetPort: 3000

# Kustomize: lets kubectl apply everything in one go with `kubectl apply -k k8s/`,
# puts every object in the codedynasty namespace, and sets image names and tags
# in ONE place. The Phase 4 pipeline will update the tags below automatically.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: codedynasty

resources:
  - namespace.yaml
  - config.yaml
  - postgres/postgres.yaml
  - signup-api/signup-api.yaml
  - signup-worker/signup-worker.yaml
  - login/login.yaml
  - list-users/list-users.yaml
  - ingress.yaml

labels:
  - pairs:
      project: codedynasty

images:
  - name: signup-api
    newName: 371510064293.dkr.ecr.eu-west-2.amazonaws.com/codedynasty/signup-api
    newTag: v0.1.0
  - name: signup-worker
    newName: 371510064293.dkr.ecr.eu-west-2.amazonaws.com/codedynasty/signup-worker
    newTag: v0.1.0
  - name: login
    newName: 371510064293.dkr.ecr.eu-west-2.amazonaws.com/codedynasty/login
    newTag: v0.1.0
  - name: list-users
    newName: 371510064293.dkr.ecr.eu-west-2.amazonaws.com/codedynasty/list-users
    newTag: v0.1.0
